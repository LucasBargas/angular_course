
<section *ngIf="!isLoading, else loading" class="container create-thinks ff-inter">
  <header class="header">
    <h2>Adicione um <br>pensamento novo</h2>
  </header>

  <form>
    <label for="pensamento">Pensamento</label>
    <input
      type="textarea"
      class="input"
      id="pensamento"
      name="pensamento"
      placeholder="Digite o Pensamento"
      [(ngModel)]="think.content"
    >

    <label for="autoria">Autor(a) ou Fonte</label>
    <input
      type="text"
      class="input"
      id="autoria"
      name="autoria"
      placeholder="Insira o nome do(a) autor(a) ou fonte"
      [(ngModel)]="think.autoria"
    >
    <label for="modelo">Selecione o modelo do card:</label>
    <div class="container-radio">
      <div class="radio-model">
        <label for="modelo1">
          <input type="radio" name="model-card" id="modelo1" value="modelo1" [(ngModel)]="think.model">

          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 1</span>
        </label>
        Prévia:
        <div class="model model1 ff-roboto-mono">
          <img src="../../../../assets/images/modelo1.png" alt="Aspas azuis">
          <p class="content">{{ think.content }}</p>
          <p class="autoria"><b>{{ think.autoria }}</b></p>
        </div>
      </div>

      <div class="radio-model">
        <label for="modelo2">
          <input type="radio" name="model-card" id="modelo2" value="modelo2" [(ngModel)]="think.model">

          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 2</span>
        </label>
        Prévia:
        <div class="model model2 ff-roboto-mono">
          <img src="../../../../assets/images/modelo2.png" alt="Aspas azuis">
          <p class="content">{{ think.content }}</p>
          <p class="autoria"><b>{{ think.autoria }}</b></p>
        </div>
      </div>

      <div class="radio-model">
        <label for="modelo3">
          <input type="radio" name="model-card" id="modelo3" value="modelo3" [(ngModel)]="think.model">

          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 3</span>
        </label>
        Prévia:
        <div class="model model3 ff-roboto-mono">
          <img src="../../../../assets/images/modelo3.png" alt="Aspas azuis">
          <p class="content">{{ think.content }}</p>
          <p class="autoria"><b>{{ think.autoria }}</b></p>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" (click)="onClickCreateThinkButton()" class="button">Salvar</button>
      <button type="button" class="button" routerLink="/lista-de-pensamentos">Cancelar</button>
    </div>
  </form>
</section>

<ng-template #loading>
  <app-loading></app-loading>
</ng-template>
