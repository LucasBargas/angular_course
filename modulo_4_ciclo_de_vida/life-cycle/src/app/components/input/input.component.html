<form class="add-item" (ngSubmit)="editando ? editarItem() : onSubmit()">
  <input
    #input
    autofocus
    type="text"
    name="item"
    [placeholder]="editando ? 'Edite o item': 'Digite o que deseja adicionar'"
    [(ngModel)]="valorItem"
  >
  <button type="submit">{{ textBtn }}</button>
</form>
