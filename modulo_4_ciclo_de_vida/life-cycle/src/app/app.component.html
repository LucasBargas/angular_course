<section class="main">
  <app-input [itemQueVaiSerEditado]="itemParaSerEditado">
  </app-input>
  <div class="container">
    <div class="lista">
      <h4 class="title-list">Lista de Compras</h4>

      <div *ngFor="let item of listaDeCompras; let i = index">
        <app-item
          [item]="item"
          (itemChanges)="onEditButton($event)"
        >
        </app-item>
      </div>
    </div>
  </div>
</section>
