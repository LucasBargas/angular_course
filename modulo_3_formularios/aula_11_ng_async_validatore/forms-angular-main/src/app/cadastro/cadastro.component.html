<main class="principal">
  <h2 class="principal__titulo">Dados do cadastro</h2>

  <form class="principal__formulario" id="formulario" #f="ngForm" (ngSubmit)="cadastrar(f)">
    <h3 class="principal__subtitulo">Dados pessoais</h3>
    <div class="formulario__campo">
      <label class="campo__etiqueta" for="nome">Nome Completo</label>
      <input name="nome" id="nome" class="campo__escrita" ngModel minlength="2" required #nome="ngModel">
      <div *ngIf="nome?.invalid && (nome?.touched || nome?.dirty)">
        <app-mensagem *ngIf="nome?.errors?.['required']" mensagem="O campo &quot;Nome&quot; deve ser preenchido.">
        </app-mensagem>

        <app-mensagem *ngIf="nome?.value && nome?.errors?.['minlength']"
          mensagem="O campo &quot;nome&quot; deve ter no mínimo 2 caracteres.">
        </app-mensagem>
      </div>
    </div>

    <div class="formulario__dupla">
      <div class="formulario__campo">
        <label class="campo__etiqueta" for="nascimento">Nascimento</label>
        <input name="nascimento" id="nascimento" type="date" class="campo__escrita" ngModel #nascimento="ngModel" required maiorIdadeValidator />

        <div style="display: flex; flex-direction: column;" *ngIf="nascimento?.invalid && (nascimento?.touched || nascimento?.dirty)">
          <app-mensagem *ngIf="nascimento?.errors?.['required']" mensagem="O campo &quot;Nascimento&quot; deve ser preenchido.">
          </app-mensagem>

          <app-mensagem *ngIf="nascimento?.errors?.['maiorIdadeValidator']" mensagem="O usuário deve ter mais de 18 anos.">
          </app-mensagem>
        </div>
      </div>

      <div class="formulario__campo">
        <label class="campo__etiqueta" for="telefone">Contato</label>
        <input name="telefone" id="telefone" type="tel" placeholder="(XX) XXXXX-XXXX" class="campo__escrita" required
          pattern="^(\+55\s?)?(\(?\d{2}\)?[\s-]?)?\d{4,5}[-]?\d{4}$" ngModel #telefone="ngModel"/>

        <div
          *ngIf="telefone?.invalid && (telefone?.touched || telefone?.dirty)">
          <app-mensagem *ngIf="telefone?.errors?.['required']"
            mensagem="O campo &quot;Telefone&quot; deve ser preenchido.">
          </app-mensagem>

          <app-mensagem *ngIf="telefone?.errors?.['pattern']"
            mensagem="Digite um &quot;telefone&quot; válido. Exemplo: (11) 99999-9999.">
          </app-mensagem>
        </div>
      </div>
    </div>

    <div class="formulario__campo">
      <label class="campo__etiqueta" for="email">E-mail</label>
      <input name="email" id="email" type="email" class="campo__escrita" ngModel required
        pattern="^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$" #email="ngModel" />

      <div *ngIf="email?.invalid && (email?.touched || email?.dirty)">
        <app-mensagem *ngIf="email?.errors?.['required']" 
          mensagem="O campo &quot;E-mail&quot; deve ser preenchido.">
        </app-mensagem>

        <app-mensagem *ngIf="email?.errors?.['pattern']"
          mensagem="Digite um e-mail válido. Exemplo: seunome&#64;dominio.com">
        </app-mensagem>
      </div>
    </div>

    <h3 class="principal__subtitulo">Endereço</h3>

    <div class="formulario__campo">
      <label class="campo__etiqueta" for="cep">CEP</label>
      <input
        name="cep"
        id="cep"
        class="campo__escrita"
        ngModel
        required
        #cep="ngModel"
        pattern="^(\d{5})(-?\d{3})$"
        minlength="8"
        maxlength="9" 
        (blur)="consultaCep($event, f)"
        validadorCep
      />

      <div *ngIf="cep?.invalid && (cep?.touched || cep?.dirty)">
        <app-mensagem *ngIf="cep?.errors?.['required']" 
          mensagem="O campo &quot;CEP&quot; deve ser preenchido.">
        </app-mensagem>

        <app-mensagem *ngIf="cep?.errors?.['pattern']"
          mensagem="Digite um CEP válido. Exemplo: 12345-678">
        </app-mensagem>

        <app-mensagem *ngIf="cep?.errors?.['validadorCep']" mensagem="O CEP não existe."></app-mensagem>
      </div>
    </div> 

    <div class="formulario__campo">
      <label class="campo__etiqueta" for="endereco">Endereço</label>
      <input name="endereco" id="endereco" class="campo__escrita" ngModel required #endereco="ngModel" />

        <div *ngIf="endereco?.invalid && (endereco?.touched || endereco?.dirty)">
          <app-mensagem *ngIf="endereco?.errors?.['required']"
            mensagem="O campo &quot;Endereco&quot; deve ser preenchido.">
          </app-mensagem>
        </div>
      </div>

    <div class="formulario__dupla">
      <div class="formulario__campo">
        <label class="campo__etiqueta" for="numero">Número</label>
        <input name="numero" id="numero" class="campo__escrita" ngModel required #numero="ngModel" />

        <div *ngIf="numero?.invalid && (numero?.touched || numero?.dirty)">
          <app-mensagem *ngIf="numero?.errors?.['required']"
            mensagem="O campo &quot;Número&quot; deve ser preenchido.">
          </app-mensagem>
        </div>
      </div>
      <div class="formulario__campo">
        <label class="campo__etiqueta" for="complemento">Complemento</label>
        <input name="complemento" id="complemento" class="campo__escrita" ngModel required #complemento="ngModel" />

        <div *ngIf="complemento?.invalid && (complemento?.touched || complemento?.dirty)">
          <app-mensagem *ngIf="complemento?.errors?.['required']"
            mensagem="O campo &quot;Complemento&quot; deve ser preenchido.">
          </app-mensagem>
        </div>
      </div>
    </div>

    <div class="formulario__campo">
      <label class="campo__etiqueta" for="bairro">Bairro</label>
      <input name="bairro" id="bairro" class="campo__escrita" ngModel required #bairro="ngModel" />

      <div *ngIf="bairro?.invalid && (bairro?.touched || bairro?.dirty)">
        <app-mensagem *ngIf="bairro?.errors?.['required']"
          mensagem="O campo &quot;Bairro&quot; deve ser preenchido.">
        </app-mensagem>
      </div>
    </div>

    <div class="formulario__dupla">
      <div class="formulario__campo">
        <label class="campo__etiqueta" for="cidade">Cidade</label>
        <input name="cidade" id="cidade" class="campo__escrita" ngModel required #cidade="ngModel" />

        <div *ngIf="cidade?.invalid && (cidade?.touched || cidade?.dirty)">
          <app-mensagem *ngIf="cidade?.errors?.['required']"
            mensagem="O campo &quot;Cidade&quot; deve ser preenchido.">
          </app-mensagem>
        </div>
      </div>

      <div class="formulario__campo">
        <label class="campo__etiqueta" for="estado">UF</label>
        <select id="estado" name="estado" class="campo__escrita" ngModel required #estado="ngModel">
          <option *ngFor="let state of states" [value]="state.uf">
            {{ state.name }}
          </option>
        </select>

        <div *ngIf="estado?.invalid && (estado?.touched || estado?.dirty)">
          <app-mensagem *ngIf="estado?.errors?.['required']"
            mensagem="O campo &quot;UF&quot; deve ser preenchido.">
          </app-mensagem>
        </div>
      </div>

    </div>
    <button type="submit" class="formulario__botao">Enviar formulário</button>
  </form>
</main>
