<section class="main">
  <app-input [itemQueVaiSerEditado]="itemParaSerEditado">
  </app-input>
  <div class="container">
    <div class="lista">
      <div class="header-lista">
        <h4 class="title-list">Lista de Compras</h4>
        <button
          (click)="limparLista()"
          class="btn-header"
        >
          <small>Limpar lista</small>
        </button>
      </div>

      <div *ngIf="listaDeCompras.length > 0; else naoTemItem">
        <div *ngFor="let item of listaDeCompras; let i = index">
          <app-item
            [item]="item"
            (emitindoItemParaEditar)="onEditButton($event)"
            (emitindoIdParaDeletar)="onDeleteButton($event)"
          >
          </app-item>
        </div>
      </div>

      <ng-template #naoTemItem>
        <small>Não tem item na lista.</small>
      </ng-template>
    </div>
  </div>
</section>
